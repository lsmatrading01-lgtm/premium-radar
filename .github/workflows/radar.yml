name: Refresh Premium Radar

on:
  schedule:
    # GitHub cron is ALWAYS UTC and does not observe DST, so these windows are
    # deliberately wide enough to cover market hours in both EDT (UTC-4) and
    # EST (UTC-5). The "market open?" guard below does the precise gating in
    # Eastern time, so runs outside the session exit in seconds.
    # DO NOT "tighten" these to match market hours — that breaks at the next
    # DST flip. Widen the cron, narrow the gate.
    #
    # Minutes are deliberately OFF-PEAK (:07/:37, not :01/:31). GitHub queues
    # every repo's scheduled workflows on a shared pool, and the surge at the
    # top and bottom of the hour is where firings get delayed by tens of
    # minutes or silently dropped. Observed 2026-09-16: with :01/:31 only 3 of
    # ~15 expected firings ran in the first day. Do not move these back toward
    # :00/:30 to buy a few minutes of freshness — a scan that never runs is
    # infinitely staler than one that runs 6 minutes later.
    #
    # Effective schedule (verified identical in EDT and EST):
    #   09:37 ET first scan — the 09:07 firing lands before the open and is
    #   gated out, so the page never shows pre-open data once the session
    #   starts — then every 30 min to 15:37, plus a near-close scan.
    - cron: '7,37 13-21 * * 1-5'
    # Near-close scan. Both hours are listed so one of them lands at 15:52 ET
    # in each DST regime; the other falls outside the gate (EDT) or adds one
    # harmless extra afternoon scan (EST).
    - cron: '52 19,20 * * 1-5'
  workflow_dispatch:
    inputs:
      full_scan:
        description: 'Force a full discovery pass (~10 min) instead of fast repricing'
        type: boolean
        default: false

# Only one refresh at a time; a long discovery pass must not race the next tick.
concurrency:
  group: radar-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # No pip install: the scan is pure standard library (urllib/json/zoneinfo).

      - name: Is the US market open?
        id: gate
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime
          from zoneinfo import ZoneInfo

          now = datetime.datetime.now(ZoneInfo("America/New_York"))
          open_  = now.replace(hour=9,  minute=30, second=0, microsecond=0)
          close  = now.replace(hour=16, minute=0,  second=0, microsecond=0)

          # GitHub fires scheduled runs late — often by 10-20 min. Gating on
          # the arrival time alone throws away a slot that was scheduled inside
          # the session but showed up after 16:00, which is exactly how the
          # last scan of the day gets lost.
          #
          # So gate on the SLOT this run belongs to, not on when it arrived:
          # take the most recent slot at or before now (the crons above only
          # fire at these minutes), require that slot to be inside the session,
          # and allow it to arrive up to `grace` late.
          #
          # Keying off the slot — rather than simply widening the close to
          # 16:15 — matters because the wide DST-proof cron really does have a
          # slot at 16:07 ET in both regimes. A wall-clock grace would let that
          # post-close slot run and restamp the page with post-close quotes;
          # this does not.
          SLOT_MINUTES = (7, 37, 52)
          grace = datetime.timedelta(minutes=15)

          slots = [
              now.replace(hour=h, minute=m, second=0, microsecond=0)
              for h in range(24) for m in SLOT_MINUTES
          ]
          past = [s for s in slots if s <= now]
          slot = max(past) if past else None

          is_open = (
              now.weekday() < 5
              and slot is not None
              and open_ <= slot <= close
              and now - slot <= grace
          )

          # Forced runs bypass the gate so you can refresh on demand.
          import os
          if os.environ.get("FORCED") == "true":
              is_open = True

          print(f"open={str(is_open).lower()}")
          print(f"now={now:%Y-%m-%d %H:%M %Z}")
          PY
        env:
          FORCED: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Skip (market closed)
        if: steps.gate.outputs.open != 'true'
        run: echo "Market closed at ${{ steps.gate.outputs.now }} — nothing to refresh."

      - name: Decide scan mode
        if: steps.gate.outputs.open == 'true'
        id: mode
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime, json, os
          from zoneinfo import ZoneInfo

          today = datetime.datetime.now(ZoneInfo("America/New_York")).date().isoformat()
          forced = os.environ.get("FULL") == "true"

          # Fast repricing is only valid against a universe discovered TODAY.
          # Otherwise (first run of the day, or a forced full pass) rediscover.
          fresh = False
          try:
              with open("signals/radar_universe.json") as fh:
                  fresh = json.load(fh).get("date") == today
          except (OSError, ValueError):
              pass

          print("fast=" + str(fresh and not forced).lower())
          PY
        env:
          FULL: ${{ inputs.full_scan }}

      - name: Scan
        if: steps.gate.outputs.open == 'true'
        env:
          UW_API_KEY: ${{ secrets.UW_API_KEY }}
          FAST: ${{ steps.mode.outputs.fast }}
        run: |
          if [ "$FAST" = "true" ]; then
            echo "::notice::Fast repricing pass"
            python3 agents/premium_scan.py --fast
          else
            echo "::notice::Full daily discovery pass (~10 min)"
            python3 agents/premium_scan.py
          fi

      - name: Build page
        if: steps.gate.outputs.open == 'true'
        # --looping is honest here: this workflow really does run every 30 min.
        run: python3 agents/radar_html.py --looping

      - name: Commit refreshed data
        if: steps.gate.outputs.open == 'true'
        env:
          STAMP: ${{ steps.gate.outputs.now }}
        run: |
          git config user.name  "premium-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html reports/premium-scan-latest.md signals/radar_universe.json
          if git diff --staged --quiet; then
            echo "No change in scan output — nothing to commit."
          else
            git commit -m "radar: refresh $STAMP"
            # Another tick may have landed while a slow discovery pass ran.
            git pull --rebase --autostash origin main
            git push
          fi
